spring:
  application:
    name: combat-achievements-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/combat_achievements
    username: postgres
    # Dev-only password for a localhost-bound DB. Override via SPRING_DATASOURCE_PASSWORD.
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; entities are validated against it
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

# App-specific config: the OSRS wiki data source.
app:
  wiki:
    base-url: https://oldschool.runescape.wiki
    user-agent: "combat-achievements-tracker (hallielangley@gmail.com)"
    refresh-max-age: PT24H       # re-pull from the wiki if cached data is older than this

management:
  endpoints:
    web:
      exposure:
        include: health,info
